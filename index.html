<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Disaster Tycoon" />
  <title>Disaster Tycoon — City 1: The Flood</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #setup-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .setup-box {
      background: #1e293b;
      padding: 24px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .setup-box h1 {
      margin: 0 0 6px;
      font-size: 23px;
      color: #38bdf8;
    }

    .setup-box p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .input-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .gender-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .gender-btn {
      padding: 14px 10px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .gender-btn.male.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }

    .gender-btn.female.selected {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.3);
      color: #f9a8d4;
    }

    .start-btn {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #22c55e;
      color: #052e16;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    #hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }

    .hud-pill {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      pointer-events: auto;
    }

    .money-text {
      color: #facc15;
      font-size: 16px;
    }

    .shop-btn {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
      cursor: pointer;
    }

    .reset-btn {
      background: #334155;
      color: #cbd5e1;
      cursor: pointer;
    }

    #action-panel {
      position: fixed;
      bottom: 24px;
      right: 14px;
      width: 225px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #475569;
      border-radius: 18px;
      padding: 12px;
      z-index: 25;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    #action-panel h3 {
      margin: 0 0 4px;
      font-size: 15px;
      color: #f8fafc;
    }

    #action-panel p {
      margin: 0 0 10px;
      font-size: 12px;
      color: #94a3b8;
    }

    .act-btn {
      width: 100%;
      padding: 11px 10px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .act-btn:last-child {
      margin-bottom: 0;
    }

    .btn-work {
      background: #22c55e;
      color: #052e16;
      font-size: 16px;
      padding: 14px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-rebuild {
      background: #facc15;
      color: #422006;
    }

    .btn-upgrade {
      background: #3b82f6;
      color: white;
      font-size: 12px;
      padding: 8px;
    }

    .act-btn:disabled {
      opacity: 0.4;
    }

    #shop-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.97);
      z-index: 80;
      display: none;
      flex-direction: column;
      padding: 18px;
      overflow-y: auto;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-shop {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .shop-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .shop-card.equipped {
      border-color: #22c55e;
    }

    .hint-banner {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      color: #cbd5e1;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Character Creation -->
  <div id="setup-screen">
    <div class="setup-box">
      <h1>🌊 City 1: The Flood</h1>
      <p>Walk around the flooded town, work manually at stations to earn cash, and rebuild every building.</p>
      <div class="input-group">
        <label>Character Name</label>
        <input type="text" id="char-name-input" placeholder="Enter your name..." maxlength="14" />
      </div>
      <div class="input-group">
        <label>Select Gender</label>
        <div class="gender-options">
          <div role="button" tabindex="0" id="btn-male" class="gender-btn male selected">Male (Blue)</div>
          <div role="button" tabindex="0" id="btn-female" class="gender-btn female">Female (Pink)</div>
        </div>
      </div>
      <div role="button" tabindex="0" id="btn-enter-city" class="start-btn">Enter City</div>
      <div style="margin-top:10px;font-size:11px;color:#64748b;">Build v3.1</div>
    </div>
  </div>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-pill money-text" id="hud-money">£0</div>
    <div class="hud-pill" id="hud-progress">City: 1/5</div>
    <div style="display:flex;gap:6px;">
      <button type="button" class="hud-pill shop-btn" id="btn-open-shop">🎩 Shop</button>
      <button type="button" class="hud-pill reset-btn" id="btn-reset-game">↺</button>
    </div>
  </div>

  <div class="hint-banner">Tap anywhere on the city to walk • Walk to a station to work!</div>

  <canvas id="gameCanvas"></canvas>

  <div id="action-panel">
    <h3 id="panel-title">Station</h3>
    <p id="panel-desc">Details</p>
    <div id="panel-buttons"></div>
  </div>

  <div id="shop-modal">
    <div class="shop-header">
      <h2 style="margin:0;">🎩 Cosmetic Shop</h2>
      <button type="button" class="close-shop" id="btn-close-shop">Back to City</button>
    </div>
    <div id="shop-content"></div>
  </div>

<script>
(function() {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  function drawRoundRect(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const WORLD_H = 1200;

    return {
      created: false,

      ownedCosmetics: ["none", "standard"],
      player: { x: 600, y: 620 },

        { id: 4, name: "Village Town Hall", icon: "🏛️", x: 880, y: 820, w: 160, h: 125, unlocked: false, unlockCost: 5000, level: 1, basePayout: 950, workDuration: 3.0, workProgress: 0 }

  }

  const COSMETICS = {

      { id: "tophat", name: "Mayor Top Hat", icon: "🎩", price: 1500 },
      { id: "crown", name: "Golden Crown", icon: "👑", price: 5000 }
    ],
    outfits: [
      { id: "standard", name: "Classic Colour", ring: null, price: 0 },

      { id: "neon", name: "Neon Glow", ring: "#22c55e", price: 2000 }
    ]
  };

  let state = createDefaultState();
  try {
    const saved = JSON.parse(localStorage.getItem("disaster_city_2d_v31"));
    if (saved && saved.stations) state = saved;
  } catch (e) {}

  let selectedGender = "Male";
  let targetPos = null;
  let isWorking = false;
  let activeStationId = null;
  let joy = { active: false, startX: 0, startY: 0, dx: 0, dy: 0, touchId: null };

  const puddles = [
    { x: 220, y: 260, r: 75 },
    { x: 740, y: 270, r: 90 },
    { x: 480, y: 730, r: 85 },
    { x: 740, y: 970, r: 95 },
    { x: 210, y: 960, r: 70 },
    { x: 980, y: 630, r: 65 }
  ];

  function saveState() {
    try { localStorage.setItem("disaster_city_2d_v31", JSON.stringify(state)); } catch (e) {}
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function bindTap(el, fn) {
    if (!el) return;
    el.addEventListener("touchend", function(e) {
      e.preventDefault();
      fn();
    }, { passive: false });
    el.addEventListener("click", function(e) {
      e.preventDefault();
      fn();
    });
  }

  function chooseGender(g) {
    selectedGender = g;
    document.getElementById("btn-male").className = "gender-btn male" + (g === "Male" ? " selected" : "");
    document.getElementById("btn-female").className = "gender-btn female" + (g === "Female" ? " selected" : "");
  }

  function enterCity() {
    const nameInput = document.getElementById("char-name-input").value.trim();
    state.name = nameInput || "Builder";
    state.gender = selectedGender;
    state.created = true;
    saveState();
    document.getElementById("setup-screen").style.display = "none";
    updateHUD();
  }

  function resetGame() {
    try { localStorage.removeItem("disaster_city_2d_v31"); } catch (e) {}
    state = createDefaultState();
    targetPos = null;
    isWorking = false;
    activeStationId = null;
    document.getElementById("setup-screen").style.display = "flex";
  }

  bindTap(document.getElementById("btn-male"), () => chooseGender("Male"));
